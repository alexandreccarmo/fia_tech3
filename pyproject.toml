[project]
name = "medgraph-lite"
version = "1.0.0"
description = "Assistente clinico auditavel - Tech Challenge Fase 3, 8IADT"
requires-python = ">=3.10"

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
