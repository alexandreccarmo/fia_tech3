# =============================================================================
# MedGraph - metadados do pacote e configuracao das ferramentas
#
# O projeto usa layout "src": o codigo da aplicacao vive em src/medgraph/,
# enquanto config/ fica na raiz de proposito - politicas.yaml precisa ser
# facil de achar e revisar por quem nao vai ler o codigo Python.
#
# Instalacao para desenvolvimento:
#     pip install -e ".[dev]"
# Isso torna `import medgraph` e `import config` disponiveis de qualquer
# diretorio, sem precisar mexer em PYTHONPATH.
# =============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medgraph"
version = "0.1.0"
description = "Assistente clinico auditavel com LangChain, LangGraph e LLM fine-tunada"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Alexandre Carneiro do Carmo" },
    { name = "Brunno Costa Castigrini" },
    { name = "Pedro Henrique Azevedo Aragao" },
    { name = "Valter Willian de Oliveira Filho" },
]
keywords = ["langchain", "langgraph", "rag", "fine-tuning", "clinical-ai", "pubmedqa"]

# As dependencias reais ficam em requirements.txt para que o professor possa
# instalar com um `pip install -r` simples, sem precisar entender pyproject.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["medgraph*", "config*"]

# -----------------------------------------------------------------------------
# Ruff - linter e formatador
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "data", "models", "logs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort (ordenacao de imports)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # comprimento de linha: ja controlado pelo formatador
    "B008",  # chamada de funcao em default: padrao normal do FastAPI/pydantic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert e esperado em teste

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "lento: testes que levam mais de alguns segundos",
    "precisa_llm: testes que exigem um modelo (Ollama ou OpenAI) disponivel",
    "precisa_rede: testes que fazem download",
]
filterwarnings = ["ignore::DeprecationWarning"]
